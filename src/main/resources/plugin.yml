name: PlayerGov
version: 0.01
main: org.github.officialbiscuityt.playerGov.PlayerGov
description: A powerful government RP/Nations Plugin :)
author: BiscuitPlays
website: https://github.com/officialbiscuityt-cloud/PlayerGov
api-version: '26.2'

commands:
  playergov:
    description: Main PlayerGov command
    usage: /playergov <subcommand>
    aliases: [pg, gov, nation, n]

permissions:
  playergov.*:
    description: Admin permission for PlayerGov
    default: op
    children:
      playergov.reload: true
      playergov.ncreate: true
      playergov.ndisband: true
      playergov.ndisband.other: true
      playergov.info: true
      playergov.info.other: true
      playergov.list: true
      playergov.transfer: true
      playergov.transfer.other: true
      playergov.description.set: true
      playergov.description.set.other: true
      playergov.description.view: true
      playergov.description.del: true
      playergov.description.del.other: true
      playergov.invite: true
      playergov.admininvite: true
      playergov.member.list: true
      playergov.kick: true
      playergov.adminkick: true
      playergov.member.accept: true
      playergov.member.deny: true

  playergov.reload:
    description: Allows reloading the PlayerGov configuration
    default: op

  playergov.ncreate:
    description: Create a nation
    default: true

  playergov.ndisband:
    description: Disband your nation
    default: true

  playergov.ndisband.other:
    description: Disband another player's nation
    default: op

  playergov.info:
    description: View your nation's information
    default: true

  playergov.info.other:
    description: View another nation's information
    default: op

  playergov.list:
    description: List all created nations
    default: op

  playergov.transfer:
    description: Transfer your nation's ownership
    default: true

  playergov.transfer.other:
    description: Transfer another nation's ownership
    default: op

  playergov.description.set:
    description: Set your nation's description
    default: true

  playergov.description.set.other:
    description: Set another nation's description
    default: op

  playergov.description.view:
    description: View a nation's description
    default: true

  playergov.description.del:
    description: Delete your nation's description
    default: true

  playergov.description.del.other:
    description: Delete another nation's description
    default: op

  playergov.invite:
    description: Invite a player to your nation
    default: true

  playergov.admininvite:
    description: Invite a player to another nation's nation
    default: op

  playergov.member.list:
    description: List members of a nation
    default: op

  playergov.kick:
    description: Kick a player from your nation
    default: true

  playergov.adminkick:
    description: Kick a player from another's nation
    default: op

  playergov.member.accept:
    description: Accept pending nation invitations
    default: true

  playergov.member.deny:
    description: Deny pending nation invitations
    default: true

  playergov.exemptFromBLockedNames:
    description: Exempt from blocked nation names
    default: false

  playergov.nationLimit.<Limit>:
    description: Customize the nation limit by permission
    default: true