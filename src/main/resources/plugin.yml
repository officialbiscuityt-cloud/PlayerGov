name: PlayerGov
version: 1.0.0
main: org.github.officialbiscuityt.playerGov.PlayerGov
description: A powerful government RP/Nations Plugin :)
author: BiscuitPlays
website: https://github.com/officialbiscuityt-cloud/PlayerGov
api-version: '1.21'

commands:
  playergov:
    description: Main PlayerGov command
    usage: /playergov <subcommand>
    aliases: [pg, plgov]

  playergovreload:
    description: Reload
    usage: /playergov reload
    aliases: []

permissions:
  playergov.reload:
    description: Allows reloading the PlayerGov configuration
    default: op