name: PlayerGov
version: 0.01
main: org.github.officialbiscuityt.playerGov.PlayerGov
description: A powerful government RP/Nations Plugin :)
author: BiscuitPlays
website: https://github.com/officialbiscuityt-cloud/PlayerGov
api-version: '26.2'

commands:
  playergov:
    description: Main PlayerGov command
    usage: /playergov <subcommand>
    aliases: [pg, gov, nation, n]


permissions:
  playergov.*:
    description: Admin permission for PlayerGov
  playergov.reload:
    descripton: Allows reloading the PlayerGov configuration
    default: op
    parent: playergov.*
  playergov.ncreate:
    description: Permission for creating a nation
    default: op
    parent: playergov.*
  playergov.ndisband:
    default: op
    parent: playergov.*
  playergov.ndisband.other:
    default: op
    parent: playergov.*
  playergov.info:
    default: op
    parent: playergov.*
  playergov.info.other:
    default: op
    parent: playergov.*
  playergov.transfer:
    default: op
    parent: playergov.*
  playergov.transfer.other:
    default: op
    parent: playergov.*
  PlayerGov.description.set:
    default: op
    parent: playergov.*
  PlayerGov.description.set.other:
    default: op
    parent: playergov.*
  PlayerGov.description.view:
    default: op
    parent: playergov.*
  PlayerGov.description.del:
    default: op
    parent: playergov.*
  PlayerGov.description.del.other:
    default: op
    parent: playergov.*