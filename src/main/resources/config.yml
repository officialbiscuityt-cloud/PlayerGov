# ==Nation Admin Configuration==

# Enable/Disable Vault Economy Features [FUTURE RELEASE]
economyEnabled: true

# (Not Case Sensitive)
blockedNationNames:
  - TestName1

# Disband nations if a player has been permanently banned
disbandAfterBan: false

# Limit how many nations your players can have! Set -1 for unlimited!
nationLimit: -1


# ==Messages==
# Configure Messages
# %player% - Command executor or the "subject"
# %nation% - The nation
# %target% - Target of the command

messages:
  prefix: "&7[&6PLAYERGOV&7]"
  nation-created: "&aNation &e%nation% &ahas been created!"
  nation-disbanded: "&cNation &e%nation% &chas been disbanded!"
  name-blocked: "&4the nation name %nation% is blocked on this server!"
  nation-transferred: "&aNation &e%nation% &a was transferred from &e%player% &ato &e%target%"
  unknown-nation: "&e%nation% &cdoes not exist!"

  unknown-player: "&cUnknown Player"
  playerExceedsAllowedNations: "&cYou have too many nations! Please use /pg disband to remove one!"

  setDescription: "&aDescription for &e%nation% &aset!"
  deletedDescription: "&cDescription for &e%nation% &cdeleted"